name: aura
description: Aura — AI-powered nutrition & fitness ecosystem

publish_to: "none"
version: 1.0.0+67

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  bloc_concurrency: ^0.2.5
  equatable: ^2.0.5

  # OAuth Sign-In
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3

  # Firebase
  firebase_core: ^3.9.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.5.1
  firebase_storage: ^12.3.6
  firebase_crashlytics: ^4.2.0
  firebase_analytics: ^11.3.6

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Local Storage / Offline Cache
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Image Picker
  image_picker: ^1.1.2

  # Barcode Scanner
  mobile_scanner: ^5.2.3

  # Voice & Speech Recognition
  speech_to_text: ^7.0.0

  # Navigation
  go_router: ^14.6.1

  # UI & Fonts
  google_fonts: ^8.1.0
  fl_chart: ^1.2.0
  cached_network_image: ^3.4.1
  video_player: ^2.8.6
  webview_flutter: ^4.10.0

  # Functional Programming
  dartz: ^0.10.1

  # Utils
  intl: ^0.20.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  purchases_flutter: ^10.4.2
  purchases_ui_flutter: ^10.4.2

  # Ads & Monetization (Free Tier)
  google_mobile_ads: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/aura_logo.png"
  adaptive_icon_background: "#121A15"
  adaptive_icon_foreground: "assets/images/aura_logo.png"
  min_sdk_android: 21


flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
